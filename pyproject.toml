[project]
name = "esm2-protein-localization"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1.0",
    "transformers>=4.37.0",
    "datasets>=2.16.0",
    "peft>=0.7.0",
    "accelerate>=0.25.0",
    "wandb>=0.16.0",
    "scikit-learn>=1.3.0",
    "pandas>=2.1.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "umap-learn>=0.5.0",
    "gradio>=4.0.0",
    "huggingface-hub>=0.20.0",
]
[project.optional-dependencies]
dev = ["pytest", "ruff", "pre-commit"]
