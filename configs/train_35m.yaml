model:
  name: "facebook/esm2_t12_35M_UR50D"
  num_classes: 10
  dropout: 0.1
  pooling: "mean"
  freeze_layers: null

data:
  max_length: 1024
  batch_size: 32
  num_workers: 8

training:
  epochs: 10
  learning_rate: 0.00002
  weight_decay: 0.01
  warmup_ratio: 0.1
  fp16: true
  device: "auto"

logging:
  wandb_project: "esm2-localization"
  wandb_run_name: "esm2-35m-full-finetune"
