model:
  name: "facebook/esm2_t6_8M_UR50D"
  num_classes: 10
  dropout: 0.1
  pooling: "mean"
  freeze_layers: null

data:
  max_length: 128
  batch_size: 4
  num_workers: 0
  max_samples: 50

training:
  epochs: 3
  learning_rate: 0.0001
  weight_decay: 0.01
  warmup_ratio: 0.1
  fp16: false
  device: "auto"

logging:
  wandb_project: "esm2-localization"
  wandb_run_name: "smoke-test"
